rules:
  - id: java-dh-dsa-keygen
    languages: [java]
    severity: WARNING
    message: "Diffie-Hellman or DSA key generation detected — quantum-vulnerable. Migrate to ML-KEM (FIPS 203) / ML-DSA (FIPS 204)."
    patterns:
      - pattern-either:
          - pattern: KeyPairGenerator.getInstance($ALGO)
          - pattern: java.security.KeyPairGenerator.getInstance($ALGO)
      - metavariable-regex:
          metavariable: $ALGO
          regex: "(?i).*(DH|DiffieHellman|DSA).*"
    metadata:
      algorithm: DH / DSA
      category: dh_keyexchange
      suggested_replacement: "Replace classical DH/DSA with ML-KEM (FIPS 203) for key agreement and ML-DSA (FIPS 204) for signatures."

  - id: java-dh-keyagreement
    languages: [java]
    severity: WARNING
    message: "Diffie-Hellman KeyAgreement detected — quantum-vulnerable (HNDL risk on established keys)."
    patterns:
      - pattern-either:
          - pattern: KeyAgreement.getInstance($ALGO)
          - pattern: javax.crypto.KeyAgreement.getInstance($ALGO)
      - metavariable-regex:
          metavariable: $ALGO
          regex: "(?i).*(DH|DiffieHellman).*"
    metadata:
      algorithm: DH
      category: dh_keyexchange
      suggested_replacement: "Replace DH key agreement with ML-KEM (FIPS 203) hybrid encapsulation."
