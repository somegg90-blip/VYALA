rules:
  - id: pqc-rsa-signing-java
    languages: [java]
    severity: WARNING
    message: "RSA signing/verification detected – quantum-vulnerable. Migrate to ML-DSA (FIPS 204)."
    metadata:
      category: rsa_signing_usage
      algorithm: RSA
      suggested_replacement: "Migrate signing to ML-DSA (FIPS 204) or SLH-DSA (FIPS 205). For hybrid transitional solutions, consider using a hybrid RSA+ML-DSA signature."
    patterns:
      # Find any Signature.getInstance call
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      # Ensure the argument is a string containing RSA
      - metavariable-regex:
          metavariable: $ALGO
          regex: ".*RSA.*"

  - id: pqc-rsa-signing-java-unresolved
    languages: [java]
    severity: INFO
    message: "Unresolved signature algorithm argument — unable to statically determine if RSA or post-quantum. Verify manually."
    metadata:
      category: unresolved_algorithm_call
      algorithm: unknown (RSA or other, depends on argument)
      suggested_replacement: "Inspect the algorithm argument to determine if it is RSA-based, then apply the appropriate post-quantum migration."
    patterns:
      # Find any Signature.getInstance call
      - pattern-either:
          - pattern: Signature.getInstance($ALGO)
          - pattern: java.security.Signature.getInstance($ALGO)
      # But exclude hardcoded string literals
      - pattern-not: Signature.getInstance("...")
      - pattern-not: java.security.Signature.getInstance("...")