rules:
  - id: java-rsa-keygen
    languages: [java]
    severity: WARNING
    message: "RSA Key Generation detected — quantum-vulnerable. Migrate to ML-KEM (FIPS 203)."
    metadata:
      algorithm: RSA
      category: rsa_keygen
      suggested_replacement: "Replace with ML-KEM (FIPS 203) key generation using a hybrid RSA+ML-KEM construction during transition."
    patterns:
      # Find any getInstance call
      - pattern-either:
          - pattern: KeyPairGenerator.getInstance($ALGO)
          - pattern: java.security.KeyPairGenerator.getInstance($ALGO)
      # Ensure the argument is a string containing RSA
      - metavariable-regex:
          metavariable: $ALGO
          regex: ".*RSA.*"

  - id: java-rsa-keygen-unresolved
    languages: [java]
    severity: INFO
    message: "Unresolved algorithm argument to KeyPairGenerator.getInstance() — unable to statically determine algorithm. Verify manually."
    metadata:
      algorithm: unknown (RSA or other, depends on argument)
      category: unresolved_algorithm_call
      suggested_replacement: "Inspect the algorithm argument at this call site to determine if it is RSA or another quantum-vulnerable algorithm, then apply the appropriate post-quantum migration."
    patterns:
      # Find any getInstance call
      - pattern-either:
          - pattern: KeyPairGenerator.getInstance($ALGO)
          - pattern: java.security.KeyPairGenerator.getInstance($ALGO)
      # But exclude hardcoded string literals (since we catch those above)
      - pattern-not: KeyPairGenerator.getInstance("...")
      - pattern-not: java.security.KeyPairGenerator.getInstance("...")