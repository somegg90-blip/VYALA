rules:
  - id: java-rsa-keygen
    languages: [java]
    severity: WARNING
    message: "RSA Key Generation detected."
    # Only match when the literal string "RSA" is explicitly passed
    pattern-either:
      - pattern: |
          java.security.KeyPairGenerator.getInstance("RSA")
      - pattern: |
          java.security.KeyPairGenerator.getInstance("RSA", ...)
    metadata:
      algorithm: RSA
      category: rsa_keygen
      suggested_replacement: "Replace with ML-KEM (FIPS 203) key generation."