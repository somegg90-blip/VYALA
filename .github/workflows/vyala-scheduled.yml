name: VYALA Nightly Scan

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  packages: read
  contents: read

jobs:
  scheduled-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Run VYALA Scanner and Upload
        uses: docker://ghcr.io/somegg90-blip/vyala-action:v1.2.0
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: 'scheduled'
        with:
          args: --path . --upload-url ${{ secrets.VYALA_BACKEND_URL }} --api-key ${{ secrets.VYALA_API_KEY }}