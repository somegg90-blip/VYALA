name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Semgrep
        # Pinned to match the scanner Dockerfile for deterministic test results
        run: pip install semgrep==1.75.0

      - name: Run regression tests
        run: go test ./internal/engine/ -v