name: VYALA PR Comment

on:
  workflow_run:
    workflows: ["VYALA PR Scan"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read

# Prevent racing double-posts
concurrency:
  group: vyala-comment-${{ github.event.workflow_run.id }}

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Download CBOM Artifact
        uses: actions/download-artifact@v4
        with:
          name: vyala-cbom-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read + validate PR metadata
        id: prmeta
        run: |
          PR=$(cat pr_number.txt); SHA=$(cat head_sha.txt)
          # Regex validation prevents command injection in the next step
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "invalid pr number"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid sha"; exit 1; }
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Post PR Comment
        uses: docker://ghcr.io/somegg90-blip/vyala:latest
        with:
          args: --comment-from-file cbom.json --pr-number ${{ steps.prmeta.outputs.pr_number }} --head-sha ${{ steps.prmeta.outputs.head_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}