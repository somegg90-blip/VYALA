name: VYALA PR Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run VYALA Scanner
        # FIXED: Use the published Docker image instead of `./` to prevent PR code execution
        uses: docker://ghcr.io/somegg90-blip/vyala-action:v1.2.0
        with:
          args: scan --path . --json cbom.json --diff-base origin/${{ github.base_ref }}
      
      - name: Upload CBOM Artifact
        if: always() # Upload even if scanner fails so we can post an error comment
        uses: actions/upload-artifact@v4
        with:
          name: vyala-cbom-${{ github.run_id }}
          path: cbom.json
          retention-days: 1