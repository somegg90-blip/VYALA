name: VYALA PR Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run VYALA Scanner
        uses: docker://ghcr.io/somegg90-blip/vyala-action:v1.2.0
        with:
          args: --path . --json cbom.json
      
      # Write PR metadata to text files for the privileged comment workflow
      - name: Write PR Metadata
        run: |
          echo "${{ github.event.pull_request.number }}" > pr_number.txt
          echo "${{ github.event.pull_request.head.sha }}" > head_sha.txt
      
      - name: Upload CBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyala-cbom-${{ github.run_id }}
          path: |
            cbom.json
            pr_number.txt
            head_sha.txt
          retention-days: 1